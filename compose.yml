services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: videgrenier221
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videgrenier221"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - videgrenier221-postgres:/var/lib/postgresql/data

volumes:
  videgrenier221-postgres:
